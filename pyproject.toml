[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simulateur"
version = "1.0.0"
description = "Simulation du déplacement de véhicules sur un réseau routier (graphe, Dijkstra, congestion)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
docs = ["sphinx>=7"]

[tool.setuptools]
packages = ["simulateur"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
